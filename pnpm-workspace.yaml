packages:
  - apps/*
  - packages/*

# Versions are pinned here and nowhere else. Every package writes "catalog:" and gets this.
# Resolved and checked 2026-09-22 (BUILD-PLAN.md §2).
allowBuilds:
  esbuild: true

catalog:
  # runtime
  fastify: 5.12.5
  "@fastify/cors": 11.3.0
  "@fastify/swagger": 9.8.2
  "@scalar/fastify-api-reference": 1.70.0
  fastify-type-provider-zod: 7.0.0
  zod: 4.6.5
  drizzle-orm: 0.45.3
  postgres: 3.4.9
  pino: 10.3.1
  jose: 6.2.12

  # frontend
  react: 19.3.0
  react-dom: 19.3.0
  next: 16.3.5
  vite: 8.3.0
  "@vitejs/plugin-react": 6.1.1
  "@tanstack/react-router": 1.170.38
  "@tanstack/router-plugin": 1.168.40
  "@tanstack/react-query": 5.103.2

  # tooling
  typescript: 5.9.3
  tsx: 4.23.15
  turbo: 2.11.2
  drizzle-kit: 0.31.11
  vitest: 5.0.1
  eslint: 10.11.0
  "@eslint/js": ^10.0.1
  typescript-eslint: 8.70.1
  "@types/node": ^22.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0

# pnpm 12 gates packages younger than its minimumReleaseAge default; it writes these itself
# on install. Leave them.
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.70.1'
  - '@typescript-eslint/parser@8.70.1'
  - '@typescript-eslint/project-service@8.70.1'
  - '@typescript-eslint/scope-manager@8.70.1'
  - '@typescript-eslint/tsconfig-utils@8.70.1'
  - '@typescript-eslint/type-utils@8.70.1'
  - '@typescript-eslint/types@8.70.1'
  - '@typescript-eslint/typescript-estree@8.70.1'
  - '@typescript-eslint/utils@8.70.1'
  - '@typescript-eslint/visitor-keys@8.70.1'
  - typescript-eslint@8.70.1
  - drizzle-kit@0.31.11
  - drizzle-orm@0.45.3

# pnpm refuses to install while a dependency has an unapproved build script.
onlyBuiltDependencies:
  - esbuild
