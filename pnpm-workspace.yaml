packages:
  - apps/*
  - packages/*

# Versions are pinned here and nowhere else. Every package writes "catalog:" and gets this.
# Resolved and checked 2026-09-22 (BUILD-PLAN.md §2).
allowBuilds:
  # dockerode (testcontainers) -> ssh2 -> cpu-features. Both are the optional ssh:// docker
  # transport and its native CPU probe; this repo talks to the local docker socket, so neither
  # is built. Answered "no" deliberately, not left unanswered.
  cpu-features: false
  ssh2: false
  esbuild: true
  protobufjs: true

catalog:
  # runtime
  fastify: 5.12.5
  "@fastify/cors": 11.3.0
  "@fastify/swagger": 9.8.2
  "@scalar/fastify-api-reference": 1.70.0
  fastify-type-provider-zod: 7.0.0
  zod: 4.6.5
  drizzle-orm: 0.45.3
  postgres: 3.4.9
  pino: 10.3.1
  jose: 6.2.12

  # Telemetry. Aspire's dashboard is the whole stack (EQ); these read its env vars with no
  # configuration of their own. The 0.x packages move together -- keep them on one version.
  "@opentelemetry/api": 1.9.1
  "@opentelemetry/sdk-node": 0.222.0
  "@opentelemetry/exporter-trace-otlp-grpc": 0.222.0
  "@opentelemetry/instrumentation-http": 0.222.0
  "@opentelemetry/instrumentation-pg": 0.74.0

  # frontend
  react: 19.3.0
  react-dom: 19.3.0
  next: 16.3.5
  vite: 8.3.0
  "@vitejs/plugin-react": 6.1.1
  "@tanstack/react-router": 1.170.38
  "@tanstack/router-plugin": 1.168.40
  "@tanstack/react-query": 5.103.2

  # tooling
  typescript: 5.9.3
  tsx: 4.23.15
  turbo: 2.11.2
  drizzle-kit: 0.31.11
  vitest: 5.0.1
  # The leak suite (BL1) brings up its own Postgres so it can never silently skip.
  testcontainers: 12.1.0
  "@testcontainers/postgresql": 12.1.0
  eslint: 10.11.0
  "@eslint/js": ^10.0.1
  typescript-eslint: 8.70.1
  "@types/node": ^22.0.0
  "@types/react": ^19.0.0
  "@types/react-dom": ^19.0.0

# pnpm 12 gates packages younger than its minimumReleaseAge default; it writes these itself
# on install. Leave them.
minimumReleaseAgeExclude:
  - '@typescript-eslint/eslint-plugin@8.70.1'
  - '@typescript-eslint/parser@8.70.1'
  - '@typescript-eslint/project-service@8.70.1'
  - '@typescript-eslint/scope-manager@8.70.1'
  - '@typescript-eslint/tsconfig-utils@8.70.1'
  - '@typescript-eslint/type-utils@8.70.1'
  - '@typescript-eslint/types@8.70.1'
  - '@typescript-eslint/typescript-estree@8.70.1'
  - '@typescript-eslint/utils@8.70.1'
  - '@typescript-eslint/visitor-keys@8.70.1'
  - typescript-eslint@8.70.1
  - drizzle-kit@0.31.11
  - drizzle-orm@0.45.3
  - '@fastify/swagger@9.8.2'
  - '@scalar/client-side-rendering@0.4.2'
  - '@scalar/fastify-api-reference@1.70.0'
  - '@scalar/json-schema-validator@0.1.3'
  - '@scalar/openapi-parser@0.29.4'
  - '@scalar/openapi-validator@0.1.3'
  - '@scalar/types@0.20.1'

# pnpm refuses to install while a dependency has an unapproved build script.
onlyBuiltDependencies:
  - esbuild
  # @opentelemetry/exporter-trace-otlp-grpc -> @grpc/grpc-js -> protobufjs
  - protobufjs
