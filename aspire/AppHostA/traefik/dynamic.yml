# Traefik's dynamic configuration, file provider (BUILD-PLAN 8.1).
#
# Every backend is a process on the HOST, not a container, so each server URL goes through
# host.docker.internal -- which the AppHost maps to the docker host gateway. The ports are the
# fixed ones from 8.1; nothing here is discovered, because there is nothing to discover on a
# single-machine POC and a static file is one fewer moving part than a docker provider.
#
# One hostname per surface, so the whole demo is reachable through ONE port. It used to be the
# control plane, the bank and a catch-all to the store API -- which meant `:8080/`, `:8080/t/acme`
# and `acme.localtest.me:8080/` all answered `{"error":{"code":"NOT_FOUND"}}` as JSON from the API,
# and the storefront was reachable only by going round the edge to 127.0.0.1:3001.
#
#   platform.localtest.me   the control plane API
#   bank.localtest.me       fake-bank
#   shop.localtest.me       the POOLED storefront -- /t/acme, /t/borg
#   dash.localtest.me       the merchant dashboard (pooled)
#   console.localtest.me    the platform console
#   api.localtest.me        the store API, by name
#   anything else           the store API, as before
#
# The store router stays a catch-all at the lowest priority on purpose. Tenant resolution takes a
# REQUEST, not a route parameter (3.6): `acme.localtest.me` and `/t/acme` are both valid ways to
# name a tenant to the API, and the edge must not decide which one is allowed. That is also why
# the storefront gets a name of its own rather than stealing `acme.localtest.me`, which the API
# resolves host-first.
http:
  routers:
    platform:
      rule: "Host(`platform.localtest.me`)"
      entryPoints: [web]
      service: platform
      priority: 100
    bank:
      rule: "Host(`bank.localtest.me`)"
      entryPoints: [web]
      service: fake-bank
      priority: 100
    storefront:
      rule: "Host(`shop.localtest.me`)"
      entryPoints: [web]
      service: storefront
      priority: 100
    dashboard:
      rule: "Host(`dash.localtest.me`)"
      entryPoints: [web]
      service: dashboard
      priority: 100
    admin:
      rule: "Host(`console.localtest.me`)"
      entryPoints: [web]
      service: admin
      priority: 100
    store-api:
      rule: "Host(`api.localtest.me`)"
      entryPoints: [web]
      service: store-pooled
      priority: 100
    store-pooled:
      rule: "PathPrefix(`/`)"
      entryPoints: [web]
      service: store-pooled
      priority: 1

  services:
    platform:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4001"
    fake-bank:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4004"
    store-pooled:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:4002"
    storefront:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:3001"
    dashboard:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5173"
    admin:
      loadBalancer:
        servers:
          - url: "http://host.docker.internal:5174"
